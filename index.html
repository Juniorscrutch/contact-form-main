<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <title>Frontend Mentor | Contact form</title>
  <link rel="stylesheet" href="style.css">
</head>


<body>
  <div id="success-message">
    <p><strong>Message sent !</strong></p>
    <p>Thanks for completing the form . we´ll be in touch soon !</p>
  </div>

  <form id="contact-form" novalidate>

    <h1>Contact Us</h1>
    <div class="row">
      <div class="form-group">
        <label for="name">First Name </label>
        <input type="text" id="name" name="name" required>
        <span class="error-message"></span>
      </div>

      <div class="form-group">
        <label for="subject">Last Name </label>
        <input type="text" id="subject" name="subject" required>
        <span class="error-message"></span>
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email Address </label>
      <input type="email" id="email" name="email" required>
      <span class="error-message"></span>
    </div>
    <div class="form-group ">
      <label>Query Type </label>

      <div class="row radio-row">
        <label>
          <input type="radio" name="query-type" value="general" required>
          <span> General Inquiry</span>
        </label>
        <label>
          <input type="radio" name="query-type" value="support" required>
          <span>Support Request</span>
        </label>
      </div>
      <div class="error-message" id="radio-error"></div>
    </div>

    <div class="form-group">
      <label for="message"> Message </label>
      <textarea id="message" name="message" required></textarea>
      <span class="error-message"></span>
    </div>

    <div class="form-group " id="query-group">
      <label>
        <input type="checkbox" name="subscribe" required>
        <span>I consent being contacted by the company.</span>
      </label>

      <span class="error-message" id="checkbox-error"></span>
    </div>
    <button type="submit">Submit</button>
  </form>


  <script src="/contact-form-main/index.js"></script>
  <footer>
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Gnaglo Date</a>.
  </footer>
</body>

</html>
