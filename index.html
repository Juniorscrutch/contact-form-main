<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <title>Frontend Mentor | Contact form</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <form id="contact-form">
    <h1>Contact Us</h1>
    <div class="row">
      <div class="form-group">
        <label for="name">First Name </label>
        <input type="text" id="name" name="name" required>
      </div>

      <div class="form-group">
        <label for="subject">Last Name </label>
        <input type="text" id="subject" name="subject" required>
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email Adress </label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="form-group">
      <label>Query Type </label>
      <div class="row radio-row">
        <label>
          <input type="radio" name="query-type" value="general" required>
          General Inquiry
        </label>
        <label>
          <input type="radio" name="query-type" value="support" required>
          Support Request
        </label>
      </div>
    </div>
    <div class="form-group">
      <label for="message">Message </label>
      <textarea id="message" name="message" required></textarea>
    </div>

    <div class="form-group">
      <label>
        <input type="checkbox" name="subscribe" value="yes">
        I consent being contacted by the company.
      </label>
    </div>
    <button type="submit">Submit</button>
  </form>

  <script src="/contact-form-main/index.js"></script>
  <footer>
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Gnaglo Date</a>.
  </footer>
</body>

</html>
